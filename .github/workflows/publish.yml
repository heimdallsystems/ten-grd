name: Publish ten-grd to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - name: Require a matching version tag
        shell: python
        run: |
          import ast
          import os
          import pathlib
          import tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert metadata['name'] == 'ten-grd'
          version = metadata['version']
          assert os.environ['GITHUB_REF'] == f'refs/tags/v{version}', 'Run publishing on the matching vX.Y.Z tag'
          tree = ast.parse(pathlib.Path('src/ten_grd/__init__.py').read_text())
          package_version = next(ast.literal_eval(node.value) for node in tree.body
                                 if isinstance(node, ast.Assign)
                                 and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets))
          assert package_version == version, 'Package and project versions differ'

  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv --without-pip /tmp/ten-grd-smoke
          python -m pip --python /tmp/ten-grd-smoke/bin/python install 'pip==26.2.2' 'certifi>=2026.10.19' dist/*.whl
          cd /tmp
          /tmp/ten-grd-smoke/bin/python -c 'from ten_grd import TenantGuard, TenantContext, InMemoryAdapter, tenant_scope; m=TenantGuard(InMemoryAdapter()); exec("with tenant_scope(TenantContext(\"release-smoke\", \"host\", \"request\")):\n    m.put(\"record\", {\"ok\": True})\n    assert m.get(\"record\").data[\"ok\"] is True")'
      - uses: actions/upload-artifact@v4
        with:
          name: ten-grd-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ten-grd/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ten-grd-distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - name: Install publishing tools
        run: python -m pip install 'twine==7.0.0' pypi-attestations 'sigstore>=4.5.1'
      - name: Generate PyPI publish attestations
        run: python -m pypi_attestations sign dist/*
      - name: Upload with OIDC Trusted Publishing
        run: python -m twine upload --non-interactive --attestations dist/*
