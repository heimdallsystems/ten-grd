name: tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python examples/agent_memory.py

  integrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grd
          POSTGRES_PASSWORD: grd_test
          POSTGRES_DB: grd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grd -d grd_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.15.0
        ports: ["6333:6333"]
    env:
      GRD_POSTGRES_DSN: postgresql://grd:grd_test@localhost:5432/grd_test
      GRD_REDIS_URL: redis://localhost:6379/0
      GRD_QDRANT_URL: http://localhost:6333
      GRD_REQUIRE_SERVICES: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bootstrap verified pip and certificate constraints
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          printf 'pip==26.2.2\ncertifi>=2026.10.19\nsigstore>=4.5.1\n' > "$RUNNER_TEMP/security-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/security-constraints.txt" >> "$GITHUB_ENV"
          python -m pip install 'certifi>=2026.10.19'
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pip install -r examples/claude_agents/requirements.txt
      - name: Wait for Qdrant
        shell: python
        run: |
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://localhost:6333/readyz", timeout=1) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
      - run: python -m pytest -q
      - run: python examples/agent_memory.py
      - run: python examples/tenant_rag.py
      - run: python -m examples.claude_agents.memory_agent
      - run: python -m examples.claude_agents.rag_agent
