services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: grd
      POSTGRES_PASSWORD: grd_test
      POSTGRES_DB: grd_test
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grd -d grd_test"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports:
      - "127.0.0.1:6333:6333"
