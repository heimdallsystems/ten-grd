[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ten-grd"
version = "0.1.0"
description = "Tenant isolation guards for developers building agentic tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["z3-solver>=4.13,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/Ikurira/10_grd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
