[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ten-grd"
version = "0.4.0"
description = "Tenant isolation guards for developers building agentic tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["z3-solver>=4.13,<6", "certifi>=2026.10.19"]

[project.scripts]
ten-grd = "ten_grd.probe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "fakeredis>=2.30,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
qdrant = ["qdrant-client>=1.15,<2"]
redis = ["redis>=5,<9"]
langchain = ["langchain-core>=1,<2"]
all = ["psycopg[binary]>=3.2,<4", "qdrant-client>=1.15,<2", "redis>=5,<9", "langchain-core>=1,<2"]

[project.urls]
Documentation = "https://heimdallsystems.github.io/ten-grd/"
Repository = "https://github.com/heimdallsystems/ten-grd"
Examples = "https://github.com/heimdallsystems/ten-grd-examples"
Issues = "https://github.com/heimdallsystems/ten-grd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
